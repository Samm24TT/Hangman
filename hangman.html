<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HangGame</title>
  </head>
  <body>
    <input id="inputBox" type="text" maxlength="1" autofocus />
    <button id="guessBtn">Guess</button>
    <p id="lettersCount"></p>
    <p id="rightLetters">Right letters: <span></span></p>
    <p id="wrongLetters">Wrong letters: <span></span></p>

    <script>
      const inputBox = document.querySelector("#inputBox");
      const guessBtn = document.querySelector("#guessBtn");
      const rightLetter = document.querySelector("#rightLetters span");
      const wrongLetter = document.querySelector("#wrongLetters span");
      const lettersCount = document.getElementById("lettersCount");

      const array = ["Java", "Python", "HTML", "CSS", "React"];

      let originalWord = array[Math.floor(Math.random() * array.length)];
      let randomWord = originalWord.toLowerCase();
      console.log(randomWord);

      let rightLetters = []; // css
      let wrongLetters = [];
      let maxWrong = 6;
      let gameOver = false;

      console.log(array.length);

      function display() {
        let letters = randomWord
          .split("") //string => array ["j", "a","v","a"]
          .map((l) => (rightLetters.includes(l) ? l : "_"));
        lettersCount.textContent = letters.join(" ");

        // if (!letters.includes("_") && !gameOver) {
        //   alert(`Congratulation! You won. The word was ${originalWord}`);
        //   gameOver = true;
        // }
      }

      display();

      function checkLose() {
        if (wrongLetters.length >= maxWrong) {
          alert(`Game over ! The correct word was ${randomWord}`);
          gameOver = true;
          return;
        }
      }

      function checkWon() {
        let won = randomWord.split("").every((l) => rightLetters.includes(l));
        console.log("Won", won);
        if (won) {
          //output is true or false
          alert("You won!");
          gameOver = true;
          return;
        }
      }
      checkWon();

      guessBtn.addEventListener("click", () => {
        if (gameOver) return;
        let input = inputBox.value.toLowerCase();

        if (!input) return;

        if (rightLetters.includes(input) || wrongLetters.includes(input)) {
          alert("It've already done.");
          inputBox.value = "";
          return;
        }

        console.log("wrong count", wrongLetters.length);

        if (randomWord.includes(input)) {
          rightLetters.push(input);
          console.log("Right", rightLetters);

          rightLetter.textContent = rightLetters.join(" ");

          // join() array => string
        } else {
          wrongLetters.push(input);
          console.log("Wrong", wrongLetters);

          wrongLetter.textContent = wrongLetters.join(" ");
        }
        inputBox.value = "";

        display();
        checkWon();
        checkLose();
      });
    </script>
  </body>
</html>
