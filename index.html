<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hangman Game</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      #wordDisplay {
        font-size: 24px;
        letter-spacing: 5px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>Guess the Word</h2>
    <p id="wordDisplay"></p>

    <input type="text" id="inputBox" maxlength="1" />
    <button id="btn">Guess</button>

    <p>Right Letters: <span id="rightLetters"></span></p>
    <p>Wrong Letters: <span id="wrongLetters"></span></p>
    <p>Attempts Left: <span id="attemptsLeft">6</span></p>

    <script>
      //Dom
      const wordDisplay = document.getElementById("wordDisplay");
      const rightLetters = document.getElementById("rightLetters");
      const wrongLetters = document.getElementById("wrongLetters");
      const attemptsLeftsDisplay = document.getElementById("attemptsLeft");
      const btn = document.getElementById("btn");
      const inputBox = document.getElementById("inputBox");

      //Game Stateges
      const wordsArray = ["Java", "Python", "HTML", "CSS", "React"];
      const randomWord =
        wordsArray[Math.floor(Math.random() * wordsArray.length)];
      console.log("Random Word :", randomWord); // for debug

      const rightLetterArray = [];
      const wrongLettersArray = [];
      const maxAttempts = 6;
      let gameOver = false;

      function updateWordDisplay() {
        let displayString = "";
        let isWinner = true;

        for (let i = 0; i < randomWord.length; i++) {
          const char = randomWord[i].toLowerCase();
          if (rightLetterArray.includes(char)) {
            displayString += randomWord[i] + " ";
          } else {
            displayString += "_ ";
            isWinner = false;
          }
        }
        wordDisplay.textContent = displayString.trim();

        if (isWinner && rightLetterArray.length > 0) {
          alert("Congratulations! You guessed the word: " + randomWord);
          gameOver = true;
        }
      }
      //to show the blank word once start
      updateWordDisplay();

      //Guessing Logic
      function handleGuess() {
        if (gameOver) return;
        const input = inputBox.value.toLowerCase();
        inputBox.value = "";
        inputBox.focus();

        if (!input || !input.match(/[a-z0-9]/i)) return;

        if (
          rightLetterArray.includes(input) ||
          wrongLettersArray.includes(input)
        ) {
          alert("You already guessed that letter!");
          return;
        }

        //check if correct or wrong
        if (randomWord.toLowerCase().includes(input)) {
          rightLetterArray.push(input);
          rightLetters.textContent = rightLetterArray.join(", ");
          updateWordDisplay();
        } else {
          wrongLettersArray.push(input);
          wrongLetters.textContent = wrongLettersArray.join(", ");

          const attemptsLeft = maxAttempts - wrongLettersArray.length;
          attemptsLeftsDisplay.textContent = attemptsLeft;

          if (attemptsLeft === 0) {
            alert("Game Over! The word was: " + randomWord);
            gameOver = true;
          }
        }
      }

      btn.addEventListener("click", handleGuess);

      inputBox.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          handleGuess();
        }
      });
    </script>
  </body>
</html>
